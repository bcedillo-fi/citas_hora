let cachedToken = null;

// ---------- UI wiring ----------
document.getElementById('toggleCred').addEventListener('click', () => {
  document.getElementById('credPanel').classList.toggle('hidden');
});

const datePick = document.getElementById('datePick');
const todayStr = new Date().toLocaleDateString('sv-SE', { timeZone: 'America/Mexico_City' }); // YYYY-MM-DD
datePick.value = todayStr.slice(0,7); // YYYY-MM
updateDayTitle();

document.getElementById('clientEmail').value = creds.clientEmail;
document.getElementById('privateKey').value = creds.privateKeyPem;

// autoconectar al cargar la página
(async () => {
  const status = document.getElementById('credStatus');
  status.textContent = 'Conectando…';
  try{
    await getAccessToken();
    status.textContent = '✓ Conectado';
    await loadSedes();
    runQuery();
  }catch(e){
    status.textContent = 'Error: ' + e.message;
    document.getElementById('credPanel').classList.remove('hidden');
  }
})();

document.getElementById('prevDay').addEventListener('click', () => shiftDay(-1));
document.getElementById('nextDay').addEventListener('click', () => shiftDay(1));
datePick.addEventListener('change', () => { updateDayTitle(); runQuery(); });
document.getElementById('sedeSelect').addEventListener('change', runQuery);

function shiftDay(delta){
  const [y,m] = datePick.value.split('-').map(Number);
  const d = new Date(y, m-1+delta, 1);
  datePick.value = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
  updateDayTitle();
  runQuery();
}

function updateDayTitle(){
  const [y,m] = datePick.value.split('-').map(Number);
  const d = new Date(y, m-1, 1);
  const fmt = d.toLocaleDateString('es-MX', { month:'long', year:'numeric' });
  document.getElementById('chartSubtitle').textContent = fmt;
}

// ---------- JWT / auth (client-side, mismo patrón que dashboards previos) ----------
function pemToArrayBuffer(pem){
  const b64 = pem.replace(/-----BEGIN PRIVATE KEY-----/, '')
                 .replace(/-----END PRIVATE KEY-----/, '')
                 .replace(/\s/g, '');
  const raw = atob(b64);
  const buf = new ArrayBuffer(raw.length);
  const view = new Uint8Array(buf);
  for (let i=0;i<raw.length;i++) view[i] = raw.charCodeAt(i);
  return buf;
}

function base64url(input){
  let str = typeof input === 'string' ? btoa(input) : btoa(String.fromCharCode(...new Uint8Array(input)));
  return str.replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}

async function importPrivateKey(pem){
  const keyBuf = pemToArrayBuffer(pem);
  return crypto.subtle.importKey('pkcs8', keyBuf, { name:'RSASSA-PKCS1-v1_5', hash:'SHA-256' }, false, ['sign']);
}

async function getAccessToken(){
  if (cachedToken && Date.now() < tokenExpiry - 30000) return cachedToken;
  const header = { alg:'RS256', typ:'JWT' };
  const now = Math.floor(Date.now()/1000);
  const claim = {
    iss: creds.clientEmail,
    scope: 'https://www.googleapis.com/auth/bigquery.readonly',
    aud: 'https://oauth2.googleapis.com/token',
    exp: now + 3600,
    iat: now
  };
  const unsigned = base64url(JSON.stringify(header)) + '.' + base64url(JSON.stringify(claim));
  const key = await importPrivateKey(creds.privateKeyPem);
  const sigBuf = await crypto.subtle.sign('RSASSA-PKCS1-v1_5', key, new TextEncoder().encode(unsigned));
  const jwt = unsigned + '.' + base64url(sigBuf);

  const resp = await fetch('https://oauth2.googleapis.com/token', {
    method:'POST',
    headers:{ 'Content-Type':'application/x-www-form-urlencoded' },
    body: 'grant_type=urn:ietf:params:oauth:grant-type:jwt-bearer&assertion=' + encodeURIComponent(jwt)
  });
  const data = await resp.json();
  if (!data.access_token) throw new Error('No se pudo obtener access_token: ' + JSON.stringify(data));
  cachedToken = data.access_token;
  tokenExpiry = Date.now() + (data.expires_in*1000);
  return cachedToken;
}

async function runBQ(sql, params={}){
  const token = await getAccessToken();
  const body = {
    query: sql,
    useLegacySql: false,
    parameterMode: 'NAMED',
    queryParameters: Object.entries(params).map(([name,value]) => ({
      name,
      parameterType: { type: 'STRING' },
      parameterValue: { value: String(value) }
    }))
  };
  const resp = await fetch(`https://bigquery.googleapis.com/bigquery/v2/projects/${PROJECT_ID}/queries`, {
    method:'POST',
    headers:{ 'Authorization':'Bearer '+token, 'Content-Type':'application/json' },
    body: JSON.stringify(body)
  });
  const data = await resp.json();
  if (data.error) throw new Error(data.error.message);
  const fields = (data.schema?.fields || []).map(f=>f.name);
  const rows = (data.rows || []).map(r => {
    const obj = {};
    r.f.forEach((cell,i) => obj[fields[i]] = cell.v);
    return obj;
  });
  return rows;
}

// ---------- connect ----------
document.getElementById('connectBtn').addEventListener('click', async () => {
  const clientEmail = document.getElementById('clientEmail').value.trim();
  const privateKeyPem = document.getElementById('privateKey').value.trim();
  const status = document.getElementById('credStatus');
  if (!clientEmail || !privateKeyPem){
    status.textContent = 'Falta client_email o private_key.';
    return;
  }
  creds = { clientEmail, privateKeyPem };
  status.textContent = 'Conectando…';
  try{
    await getAccessToken();
    status.textContent = '✓ Conectado. Cargando sedes…';
    await loadSedes();
    status.textContent = '✓ Conectado';
    document.getElementById('credPanel').classList.add('hidden');
    runQuery();
  }catch(e){
    status.textContent = 'Error: ' + e.message;
  }
});

async function loadSedes(){
  const rows = await runBQ(`
    SELECT DISTINCT delegaciones_name_comer AS sede
    FROM \`${PROJECT_ID}.${DATASET}.${TABLE}\`
    WHERE delegaciones_name_comer IS NOT NULL AND delegaciones_name_comer != ''
    ORDER BY sede
  `);
  const sel = document.getElementById('sedeSelect');
  sel.innerHTML = '';
  rows.forEach(r => {
    const opt = document.createElement('option');
    opt.value = r.sede;
    opt.textContent = r.sede;
    sel.appendChild(opt);
  });
  if (rows.length) sel.value = rows[0].sede;
}

// ---------- main query ----------
async function runQuery(){
  if (!creds) return;
  const sede = document.getElementById('sedeSelect').value;
  const mes = datePick.value; // YYYY-MM
  if (!sede || !mes) return;

  document.getElementById('emptyState').style.display = 'flex';
  document.getElementById('emptyState').innerHTML = '⏳<br>Consultando BigQuery…';
  document.getElementById('hourChart').style.display = 'none';

  try{
    const rows = await runBQ(`
      SELECT
        EXTRACT(HOUR FROM PARSE_TIME('%H:%M:%S', hora)) AS hora_num,
        COUNT(*) AS citas
      FROM \`${PROJECT_ID}.${DATASET}.${TABLE}\`
      WHERE citas_concep_cit_con_grp_name = 'Primera Vez'
        AND estados_citas_name = 'Terminada'
        AND delegaciones_name_comer = @sede
        AND FORMAT_DATE('%Y-%m', DATE(fecha)) = @mes
      GROUP BY hora_num
      ORDER BY hora_num
    `, { sede, mes });

    renderChart(rows);
  }catch(e){
    document.getElementById('emptyState').innerHTML = '⚠️ Error al consultar:<br>' + e.message;
  }
}

function renderChart(rows){
  const byHour = {};
  rows.forEach(r => byHour[r.hora_num] = parseInt(r.citas,10));

  const hours = [];
  for (let h=7; h<=20; h++) hours.push(h); // horario clínico típico
  const counts = hours.map(h => byHour[h] || 0);
  const total = counts.reduce((a,b)=>a+b,0);

  document.getElementById('kTotal').textContent = total;
  if (total === 0){
    document.getElementById('emptyState').style.display = 'flex';
    document.getElementById('emptyState').innerHTML = '📭<br>Sin citas Primera Vez Terminadas para esta sede/mes';
    document.getElementById('hourChart').style.display = 'none';
    document.getElementById('kPico').textContent = '—';
    document.getElementById('kProm').textContent = '—';
    return;
  }

  const maxIdx = counts.indexOf(Math.max(...counts));
  document.getElementById('kPico').textContent = `${hours[maxIdx]}:00`;
  const activeHours = counts.filter(c => c>0).length;
  document.getElementById('kProm').textContent = (total/activeHours).toFixed(1);

  document.getElementById('emptyState').style.display = 'none';
  const canvas = document.getElementById('hourChart');
  canvas.style.display = 'block';

  if (chart) chart.destroy();
  chart = new Chart(canvas, {
    type: 'bar',
    data:{
      labels: hours.map(h => h.toString().padStart(2,'0') + ':00'),
      datasets:[{
        label: 'Citas Primera Vez Terminadas',
        data: counts,
        backgroundColor: '#A55D49',
        borderRadius: 6,
        maxBarThickness: 36
      }]
    },
    options:{
      responsive:true,
      maintainAspectRatio:false,
      plugins:{ legend:{ display:false } },
      scales:{
        y:{ beginAtZero:true, ticks:{ precision:0, color:'#6b6055' }, grid:{ color:'#F2DFE1' } },
        x:{ ticks:{ color:'#6b6055' }, grid:{ display:false } }
      }
    }
  });
}
